# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry is an advisory assessed as
# not affecting wickra-xray; this mirrors the cargo-deny `ignore` list in
# deny.toml at the OSV layer.
#
# OSV-Scanner resolves a config per lockfile, from the directory the lockfile
# sits in -- so this file covers Cargo.lock, and web/package-lock.json has its
# own osv-scanner.toml beside it. A single root file does not reach the web
# lockfile: the scanner loads it, finds the id unmatched, and reports both the
# vulnerability and an "unused ignores" warning.
