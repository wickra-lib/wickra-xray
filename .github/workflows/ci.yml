name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ["--all-features", "--no-default-features"]
    runs-on: ${{ matrix.os }}
    # The xray-cli binary (wickra-xray) and the C ABI cdylib
    # (wickra_xray) share a stem on Windows, so building both in one
    # --workspace pass can race on the same .pdb and trip LNK1201. Dropping debug
    # info (tests do not need it) removes the collision and keeps runner disk use
    # down; RUSTFLAGS is part of the cache key.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin; the C ABI cdylib by the `c-abi` job. Exclude both here.
      - run: cargo build --workspace ${{ matrix.features }} --exclude wickra-xray-python --exclude wickra-xray-c
      - run: cargo test --workspace ${{ matrix.features }} --exclude wickra-xray-python --exclude wickra-xray-c

  lint:
    timeout-minutes: 30
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  msrv:
    timeout-minutes: 30
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Node binding (napi 3) needs Rust 1.88 and is checked separately; the
      # Python binding needs maturin's platform link flags and is built by the
      # `python` job. The library, CLI, C ABI and WASM stay at 1.86.
      - run: >
          cargo build --workspace
          --exclude wickra-xray-python
          --exclude wickra-xray-node

  msrv-node:
    timeout-minutes: 30
    name: MSRV node (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wickra-xray-node

  supply-chain:
    timeout-minutes: 20
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-deny
      - run: cargo deny check

  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: osv-scanner
      # osv-scanner.toml was committed with its ignore entries and nothing ever
      # ran the scanner it configures.
      - run: osv-scanner scan source --recursive .

  # Advisory, never blocking. links.yml stays the authoritative run: external
  # link rot is non-deterministic, so a third-party outage must not be able to
  # fail a pull request. But a weekly job means a link this PR breaks is found
  # up to seven days later, by which time it reads as unrelated. This surfaces it
  # now and cannot stop anything -- `continue-on-error` keeps the result visible
  # in the checks list while leaving the conclusion neutral.
  links:
    name: Links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "**/*.md"
          fail: true

  # Five static checks that no other job can fail on. Each exists because the
  # thing it guards is invisible to the rest of CI: the golden corpus compares
  # values, so a binding that lost a method has no test to run; a version that
  # disagrees with itself compiles fine and surfaces on a user's machine after an
  # irreversible tag; a relative link in a binding README resolves on GitHub and
  # nowhere else; and a licence text that never travelled is missing only in the
  # published package.
  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # static checks; if they are not done in ten minutes they are stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ten language reaches sit on one C ABI, and each is tested separately.
      # This holds every surface to the header instead.
      - name: Compare every binding's surface with the C ABI
        run: python3 scripts/check_binding_surface.py

      # The version lives in two dozen declarations across six package managers.
      # A bump that misses one ships a package pinning a binary that was never
      # published, and that surfaces on a user's machine after the tag.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # The binding READMEs are the long descriptions PyPI, NuGet, pkg.go.dev and
      # r-universe render. A repository-relative link resolves on GitHub and is
      # dead on every one of those pages.
      - name: Binding READMEs link absolutely
        run: python3 scripts/check_readme_links.py

      # Cargo decides what to package from git, so a licence copy that is
      # untracked or ignored never reaches the .crate. Committed copies are the
      # only thing that works, and their cost is drift.
      - name: Published packages carry their licence texts
        run: python3 scripts/check_license_copies.py

      # Every other binding is compiled from this tree in the same job, so a
      # wrapper cannot disagree with the ABI it calls. R is the exception: the
      # hand-written glue is compiled against whatever header configure staged,
      # and nothing else proves the two match. R CMD check does not see it --
      # a call with the wrong arity still links by name.
      - name: The R wrapper matches the C ABI
        run: python3 scripts/check_r_abi_skew.py

  semver:
    name: Public API (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: it builds rustdoc JSON for each crate and its baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-semver-checks

      # The published API is a promise and the version number says what may
      # change: a patch release must not move the public surface. It compiles
      # here and breaks at the consumer, which is the failure no other job sees.
      #
      # `check-release` compares against the newest version already on
      # crates.io, and neither crate has been published -- both return 404
      # today. Running it now fails on the missing baseline, which says nothing
      # about the code. So the baseline is looked up first and the check skips,
      # loudly, until there is something to compare against; from the first
      # release onwards it runs without anyone remembering to switch it on.
      #
      # Deliberately not `continue-on-error`: that would hide a real API break
      # later, which is the one thing this job exists to catch.
      #
      # Named crates rather than --workspace: the bench and binding crates are
      # `publish = false`, so they have no baseline and promise nothing.
      - name: Check the published crates
        shell: bash
        run: |
          set -euo pipefail
          published=()
          for crate in wickra-xray-core wickra-xray; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "User-Agent: wickra-xray-ci" \
              "https://crates.io/api/v1/crates/$crate")
            if [ "$code" = "200" ]; then
              published+=("-p" "$crate")
            else
              echo "::notice::$crate is not on crates.io yet (HTTP $code); no baseline to compare against"
            fi
          done
          if [ "${#published[@]}" -eq 0 ]; then
            echo "no crate has been published yet -- nothing to compare. This job starts checking by itself once the first release lands."
            exit 0
          fi
          cargo semver-checks check-release "${published[@]}"

  coverage:
    timeout-minutes: 30
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-llvm-cov
      # Measure the core in its sequential (no rayon) configuration — the frame
      # is byte-identical either way, and this keeps coverage deterministic.
      - name: Generate coverage (lcov)
        run: >
          cargo llvm-cov --no-default-features
          -p wickra-xray-core
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    timeout-minutes: 25
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-fuzz
      - name: Fuzz spec_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu spec_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz dataset_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu dataset_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz build_frame (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu build_frame -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz book_fold (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu book_fold -- -max_total_time=30
        working-directory: fuzz

  # The runnable examples are the first thing a reader copies, and only
  # examples/rust was ever compiled -- it is a workspace member, so cargo built
  # it. The other seven were not built by anything: a change to the JSON surface
  # would have left them broken in the repository with every check green.
  #
  # Each one builds the same frame, so each is checked for the same match rather
  # than only for exiting zero. The C and C++ examples are built and run by the
  # `c-abi` job through CMake and ctest, which is where their toolchain already
  # is. The WASM demo needs a DOM and a fetched .wasm, so its in-page module is
  # parse-checked here instead of executed.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Warm cargo registry (retry transient DNS/registry flakes)
        shell: bash
        # CARGO_NET_RETRY rides out short blips, but a longer runner DNS outage
        # outlasts cargo's rapid in-process retries: the crates.io index fetch
        # the first cargo step does ("Could not resolve host: index.crates.io")
        # then fails the whole job. Pre-fetch the dependency graph here with real
        # backoff, so the steps after it resolve from the warmed local cache.
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo fetch; then exit 0; fi
            echo "::warning::cargo fetch failed (attempt $attempt/5) -- likely a registry/DNS flake; retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "::error::cargo fetch still failing after 5 attempts"
          exit 1

      - name: Build the C ABI library the non-native bindings link against
        run: cargo build -p wickra-xray-c --release

      - name: Stage the native library for Go and put it on the loader path
        shell: bash
        run: |
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_xray.so bindings/go/lib/linux_amd64/
          echo "LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Every example builds the same one-panel frame from the same two trades;
      # this is what each run is checked against, so an example that starts and
      # prints nothing fails.
      - name: Rust
        shell: bash
        run: |
          out=$(cargo run -q -p wickra-xray-example)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      # `maturin develop` wants a virtualenv; the python job builds a wheel and
      # installs it instead, which needs none. Same route here.
      - name: Python
        shell: bash
        run: |
          # No `pip install --upgrade pip` first: that fetch is itself unpinned,
          # which is what the hash-locked file below exists to avoid, and the
          # runner image ships a pip far newer than --require-hashes needs.
          python -m pip install --require-hashes -r .github/requirements/ci-dev.txt
          ( cd bindings/python && maturin build --release --out dist )
          python -m pip install --no-index --find-links bindings/python/dist wickra-xray
          out=$(python examples/python/frame.py)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_examples
        continue-on-error: true
        with:
          node-version: "22"
      - name: Pause before retrying the toolchain download
        if: steps.setup_node_examples.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_node_examples.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Node.js
        shell: bash
        run: |
          ( cd bindings/node && npm install --no-audit --no-fund && npx napi build --platform --release )
          ( cd examples/node && npm install --no-audit --no-fund )
          out=$(node examples/node/frame.js)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      # The browser demo embeds an ES module, and nothing else in this repository
      # parses a script inside an HTML file. Extract it and parse-check it, so a
      # broken edit to the in-page logic fails here rather than in a reader's
      # browser. It cannot be *run* here for the same reason the others can: it
      # needs a DOM and a fetched .wasm, which is a headless browser, not a step.
      - name: WASM demo module script
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in examples/wasm/*.html; do
            node -e 'const fs=require("fs");const h=fs.readFileSync(process.argv[1],"utf8");const m=h.match(/<script type="module">([\s\S]*?)<\/script>/);if(!m){console.error("no <script type=module> in "+process.argv[1]);process.exit(1);}fs.writeFileSync("module-check.mjs",m[1]);' "$f"
            echo "node --check (module of) $f"
            node --check module-check.mjs
            count=$((count + 1))
          done
          rm -f module-check.mjs
          echo "checked $count WASM .html module script(s)"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Go
        shell: bash
        run: |
          out=$(cd examples/go && go run .)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "22"
      - name: Java
        shell: bash
        run: |
          mvn -f bindings/java/pom.xml -q package -DskipTests
          javac -cp bindings/java/target/classes examples/java/Frame.java -d examples/java/out
          out=$(java --enable-native-access=ALL-UNNAMED \
            -Dnative.lib.dir="$PWD/target/release" \
            -cp "bindings/java/target/classes:examples/java/out" Frame)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: C#
        shell: bash
        run: |
          out=$(dotnet run --project examples/csharp/Frame)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          use-public-rspm: true
      - name: R
        shell: bash
        env:
          WKXRAY_INC: ${{ github.workspace }}/bindings/c/include
          WKXRAY_LIB: ${{ github.workspace }}/target/release
        run: |
          R CMD INSTALL bindings/r
          out=$(Rscript examples/r/frame.R)
          echo "$out"
          echo "$out" | grep -q '"symbol":"AAA"'

  python:
    timeout-minutes: 40
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pip install maturin pytest
      - run: maturin build --out dist
        working-directory: bindings/python
      - run: pip install --no-index --find-links bindings/python/dist wickra-xray
      - run: pytest bindings/python/tests -q

  python-wheel-container-smoke:
    name: Python wheel (${{ matrix.manylinux }} smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same invocation release.yml uses for its Linux rows, so what is proven
      # here is what will run there. Without it the container build is exercised
      # for the first time during the release itself.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: The container produced a wheel
        shell: bash
        run: |
          set -euo pipefail
          ls -l bindings/python/dist
          test "$(find bindings/python/dist -name '*.whl' | wc -l)" -ge 1

  node:
    timeout-minutes: 40
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not npm ci): the per-platform optionalDependencies point at
      # native packages that are not published until the first release.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      # The generated glue is platform-independent, so a drift check on one OS is
      # enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check index.js / index.d.ts are in sync
        if: runner.os == 'Linux'
        run: cd bindings/node && git diff --exit-code -- index.js index.d.ts
      - name: Run Node tests
        run: cd bindings/node && node --test
      # `files` lists `*.node`, so the main tarball is supposed to carry the
      # native binary rather than resolve it through the optionalDependencies.
      # Nothing held that promise: a name dropped from `files` is not an error,
      # it is a package that installs and then cannot load. Check the tarball
      # the release would upload, on the platform whose binary it carries.
      - name: The npm tarball carries the module it promises
        shell: bash
        working-directory: bindings/node
        run: |
          # The ${...} below are JavaScript template literals inside node -e,
          # not shell expansions -- single quotes are what keeps the shell out
          # of them. The reason goes on its own line: shellcheck reads anything
          # after the directive as further directives and reports SC1072 on it.
          # shellcheck disable=SC2016
          npm pack --dry-run --json | node -e '
            const chunks = [];
            process.stdin.on("data", c => chunks.push(c)).on("end", () => {
              const pkg = JSON.parse(chunks.join(""))[0];
              const names = pkg.files.map(f => f.path);
              const required = ["index.js", "index.d.ts", "package.json"];
              const missing = required.filter(n => !names.includes(n));
              if (!names.some(n => n.endsWith(".node"))) missing.push("the native .node binary");
              if (missing.length) {
                console.error(`::error::${pkg.name} would publish without ${missing.join(", ")}`);
                process.exit(1);
              }
              console.log(`${pkg.name}: ${names.length} files, entry points present`);
            });'

  wasm:
    timeout-minutes: 25
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: wasm-pack
      - name: Build the wasm binding
        run: wasm-pack build --target web
        working-directory: bindings/wasm

      # The job used to stop at the line above: the binding was compiled on
      # every push and executed on none of them, while the README advertises a
      # live in-browser demo and the core documents the sequential WASM path as
      # byte-identical to the parallel one. A second build for node makes the
      # module loadable without a browser; `pkg/` stays what ships.
      - name: Build the wasm binding for node
        run: wasm-pack build --target nodejs --out-dir pkg-node
        working-directory: bindings/wasm
      # The toolchain download flakes on the runners often enough that a retry
      # with no code change is the standard fix, the same way the node, python
      # and examples jobs handle it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_wasm
        continue-on-error: true
        with:
          node-version: "22"
      - name: Pause before retrying the toolchain download
        if: steps.setup_node_wasm.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_node_wasm.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # An explicit glob rather than `node --test tests/`: Node 22 reads a bare
      # directory argument as a module path and fails with MODULE_NOT_FOUND,
      # while Node 20 scans it. The glob behaves the same on both.
      - name: Run the wasm tests
        shell: bash
        run: node --test tests/*.test.js
        working-directory: bindings/wasm

  web:
    timeout-minutes: 30
    name: Web renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: wasm-pack
      # The web app depends on the wasm binding's pkg/ via a file: dependency, so
      # build it before installing web dependencies.
      - name: Build the wasm binding
        run: wasm-pack build --target web
        working-directory: bindings/wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build and lint the web renderer
        run: cd web && npm ci && npm run build && npm run lint

  c-abi:
    timeout-minutes: 40
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-xray-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-xray-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner. This
      # also validates the vendored Go copy.
      - name: Check the C header (cbindgen + Go copy) is in sync
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/check-cbindgen.sh
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  go:
    timeout-minutes: 40
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-xray-c --release
      - name: Vendored header in sync with the C ABI
        shell: bash
        run: |
          if ! diff -u bindings/c/include/wickra_xray.h bindings/go/include/wickra_xray.h; then
            echo "::error::bindings/go/include/wickra_xray.h is stale — copy bindings/c/include/wickra_xray.h over it"
            exit 1
          fi
      - name: Stage the native library
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_xray.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_xray.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_xray.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"
      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet and test the Go binding
        shell: bash
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  csharp:
    timeout-minutes: 40
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library from target/release (see the
      # <Content> items), so build it in the release profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-xray-c --release
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraXray.Tests/WickraXray.Tests.csproj -c Release

  java:
    timeout-minutes: 40
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The pom points native.lib.dir at target/debug, so build the debug profile.
      - name: Build the C ABI library
        run: cargo build -p wickra-xray-c
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    timeout-minutes: 40
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WKXRAY_INC: ${{ github.workspace }}/bindings/c/include
      WKXRAY_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-xray-c --release
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time.
        run: |
          export WKXRAY_INC="${WKXRAY_INC//\\//}"
          export WKXRAY_LIB="${WKXRAY_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            WKXRAY_LIB_UNIX=$(cygpath -u "$WKXRAY_LIB")
            export PATH="$WKXRAY_LIB_UNIX:$PATH"
          else
            export LD_LIBRARY_PATH="$WKXRAY_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKXRAY_LIB:$DYLD_LIBRARY_PATH"
          fi
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R
          # golden.R is kept out of the built tarball (.Rbuildignore) because it
          # reads the corpus at the repository root, which does not exist inside
          # a tarball -- and that tarball is what r-universe runs R CMD check
          # against on every platform. Here there *is* a repository root, so it
          # runs, and this is the only place the golden cases are checked from R.
          Rscript bindings/r/tests/golden.R
